[profile.default]
libs = ["dependencies"]
auto_detect_remappings = false
solc_version = "0.8.30"
via_ir = true
optimizer = true
evm_version = "prague"
remappings = [
    "@openzeppelin-contracts-5.2.0/=dependencies/@openzeppelin-contracts-5.2.0/",
    "cartesi-machine-solidity-step-0.13.0/=dependencies/cartesi-machine-solidity-step-0.13.0/",
    "forge-std-1.9.6/=dependencies/forge-std-1.9.6/",
]
fs_permissions = [
    { access = "read-write", path = "deployments" },
    { access = "read-write", path = "script/utils/ContractDeployers.sol" },
]

[fmt]
line_length = 90
sort_imports = true

[doc]
out = "forge-docs"

[invariant]
runs = 32
depth = 100
fail_on_revert = true

[soldeer]
remappings_location = "config"

[lint]
exclude_lints = ["incorrect-shift"]

[dependencies]
"@openzeppelin-contracts" = "5.2.0"
forge-std = "1.9.6"
cartesi-machine-solidity-step = { version = "0.13.0", git = "https://github.com/cartesi/machine-solidity-step.git", tag = "v0.13.0" }

[rpc_endpoints]
arbitrum_mainnet = "${ARBITRUM_MAINNET_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
base_mainnet = "${BASE_MAINNET_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
ethereum_mainnet = "${ETHEREUM_MAINNET_RPC_URL}"
ethereum_sepolia = "${ETHEREUM_SEPOLIA_RPC_URL}"
op_mainnet = "${OP_MAINNET_RPC_URL}"
op_sepolia = "${OP_SEPOLIA_RPC_URL}"

# See more config options https://book.getfoundry.sh/reference/config/
