name: Check generated code

on:
  pull_request:
  push:
    branches:
      - main
      - release/*
      - next/*

jobs:
  check-generated-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Regenerate contract deployers
        run: make codegen

      - name: Check that generated code is up to date
        run: |
          if ! git diff --exit-code -- script/utils/ContractDeployers.sol; then
            echo "::error::script/utils/ContractDeployers.sol is out of sync with its generator."
            echo "Regenerate it locally and commit the result: make codegen"
            exit 1
          fi
          if ! git diff --exit-code -- src/common/Version.sol; then
            echo "::error::src/common/Version.sol is out of sync with its generator."
            echo "Regenerate it locally and commit the result: make codegen"
            exit 1
          fi
