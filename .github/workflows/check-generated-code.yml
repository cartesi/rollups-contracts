name: Check generated code

on:
  pull_request:
  push:
    branches:
      - main
      - release/*
      - next/*

jobs:
  check-generated-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup

      - name: Regenerate contract deployers
        run: make codegen

      - name: Check that generated code is up to date
        run: |
          if ! git diff --exit-code -- script/utils/ContractDeployers.sol; then
            echo "::error::script/utils/ContractDeployers.sol is out of sync with its generator."
            echo "Regenerate it locally and commit the result: make codegen"
            exit 1
          fi
