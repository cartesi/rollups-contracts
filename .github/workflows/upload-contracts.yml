name: Upload contracts

on:
  pull_request:
  push:
    branches:
      - main
      - release/*
      - next/*
    tags:
      - v*

jobs:
  push:
    name: Publish contracts to Soldeer.xyz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Publish Soldeer package
        run: make publish-soldeer-package
        env:
          DRY_RUN: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          SOLDEER_API_TOKEN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SOLDEER_API_TOKEN || '' }}
