name: Upload Rust bindings

on:
  pull_request:
  push:
    branches:
      - main
      - release/*
      - next/*
    tags:
      - v*

jobs:
  publish:
    name: Publish Rust bindings to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Generate Rust bindings
        run: make rust-bindings

      - name: Upload package to crates.io
        working-directory: out/bindings
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            cargo publish --dry-run
          else
            cargo publish
          fi
        env:
          DRY_RUN: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          CARGO_REGISTRY_TOKEN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.CARGO_REGISTRY_TOKEN || '' }}
